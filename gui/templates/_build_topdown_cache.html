{# Offer to build the zone top-down geometry cache when it is missing. Needs `zoneid`. #}
{% if zoneid is not none %}
<div class="warn" id="td-build-box">
  <p style="margin:0 0 6px">No zone-geometry cache has been built for zone {{ zoneid }} yet, so the aligned overlay can't be drawn.</p>
  <button type="button" id="td-build-btn" class="chip">Build zone geometry cache</button>
  <pre id="td-build-log" class="muted" style="white-space:pre-wrap;margin:6px 0 0" hidden></pre>
</div>
<script>
(() => {
  const btn = document.getElementById('td-build-btn'), log = document.getElementById('td-build-log');
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Building… (large zones can take a minute)';
    log.hidden = true;
    try {
      const r = await fetch('/captures/topdown/{{ zoneid }}/build', {method: 'POST'});
      const j = await r.json();
      if (j.ok) { location.reload(); return; }
      log.textContent = j.log || 'Build failed with no details.'; log.hidden = false;
    } catch (e) { log.textContent = 'Build request failed: ' + e.message; log.hidden = false; }
    btn.disabled = false; btn.textContent = 'Build zone geometry cache';
  });
})();
</script>
{% endif %}

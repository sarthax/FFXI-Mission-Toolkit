{# Every AH tool lives inside the hub at /auction-house. Opened directly, a tool page forwards there;
   inside the hub it is loaded with ?embed=1 and shows no extra chrome. #}
<script>
(() => {
  if (/[?&]embed=1/.test(location.search)) { document.documentElement.classList.add('ah-embed'); return; }
  const slug = location.pathname.replace(/^\/auction-house\/?/, '').replace(/\/$/, '');
  location.replace('/auction-house' + (slug ? '#' + slug : ''));
})();
</script>
<style>html.ah-embed #app-shell{display:none!important}html.ah-embed body{padding-top:0!important}</style>
<script src="/static/auction_house_common.js"></script>
<script src="/static/auction_house_pickers.js" defer></script>

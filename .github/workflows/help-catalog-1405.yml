name: Help and Catalog Scenario Boundaries 1405
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'gui/templates/help.html'
      - 'feature_catalog/features.json'
      - 'test_fixtures/test_help_catalog_1405.cjs'
      - 'src/workbench/server_admin/feature_testing/typed_action_library.py'
      - '.github/workflows/help-catalog-1405.yml'
  workflow_dispatch:
concurrency:
  group: budget-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  document-boundaries:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test_fixtures/test_help_catalog_1405.cjs

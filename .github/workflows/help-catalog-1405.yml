name: Help and Catalog Scenario Boundaries 1405
on:
  pull_request:
    paths:
      - 'gui/templates/help.html'
      - 'feature_catalog/features.json'
      - 'test_fixtures/test_help_catalog_1405.cjs'
      - 'src/workbench/server_admin/feature_testing/typed_action_library.py'
      - '.github/workflows/help-catalog-1405.yml'
  workflow_dispatch:
jobs:
  document-boundaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test_fixtures/test_help_catalog_1405.cjs

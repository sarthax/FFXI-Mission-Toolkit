name: Autonomous worker offline tests
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/autonomous_worker/**'
      - 'tests/test_autonomous_worker.py'
      - '.github/scripts/ready_watch.py'
      - '.github/workflows/autonomous-worker-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: budget-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulations:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Non-destructive simulations (no agent or credentials)
        run: python -m unittest discover -s tests -p test_autonomous_worker.py -v

name: add-to-project

# Adds new issues and PRs to the "Unified Agent Work Board" (https://github.com/users/sarthax/projects/2).
# Needs repo secret ADD_TO_PROJECT_PAT: a classic personal access token with scopes `project` and `repo`.
# Without the secret this job skips (does not fail).

on:
  issues:
    types: [opened, transferred]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: tok
        env:
          TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          if [ -n "$TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "ADD_TO_PROJECT_PAT not set; skipping"; echo "have=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/add-to-project@v1.0.2
        if: steps.tok.outputs.have == 'true'
        with:
          project-url: https://github.com/users/sarthax/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

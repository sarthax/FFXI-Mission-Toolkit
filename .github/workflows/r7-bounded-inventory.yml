name: R7 Bounded Inventory Offline
on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/**"
      - "test_fixtures/test_bounded_inventory_r7.py"
      - ".github/workflows/r7-bounded-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Execute focused negative and positive endpoint fixtures
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q test_fixtures/test_bounded_inventory_r7.py

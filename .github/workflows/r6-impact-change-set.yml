name: R6 Impact Change Set (Offline)

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/impact_changeset.py"
      - "tools/dsp_change_set.py"
      - "test_fixtures/test_impact_changeset.py"
      - ".github/workflows/r6-impact-change-set.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Validate change-set schema and the helper against throwaway synthetic git repositories
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q test_fixtures/test_impact_changeset.py

name: R7 Bounded Selected Jobs Offline

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/**"
      - "test_fixtures/test_bounded_selected_jobs_r7.py"
      - ".github/workflows/r7-bounded-selected-jobs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-selected-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline regression dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Exercise synthetic persisted-job scope and negative cases
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q test_fixtures/test_bounded_selected_jobs_r7.py

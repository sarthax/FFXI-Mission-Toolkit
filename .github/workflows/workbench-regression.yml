name: Workbench Regression

on:
  push:
    branches:
      - workbench-rework/audit-foundation
  pull_request:
    paths:
      - "workbench/**"
      - "test_fixtures/**"
      - "feature_*.py"
      - "capture_*.py"
      - "packet_*.py"
      - "workbench_*.py"
      - ".github/workflows/workbench-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Workbench core regression fixtures
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python test_fixtures/test_packet_identity.py
          python test_fixtures/test_graph_cpp_symbol_resolution.py
          python test_fixtures/test_graph_enum_resolution.py
          python test_fixtures/test_cpp_enum_dependency_confidence.py
          python test_fixtures/test_build_function_mapping.py
          python test_fixtures/test_server_adapter_profiles.py
          python test_fixtures/test_server_logical_records.py
          python test_fixtures/test_server_entity_logical_mappings.py
          python test_fixtures/test_server_sql_logical_extraction.py
          python test_fixtures/test_battlefield_logical_profiles.py
          python test_fixtures/test_feature_surface.py
          python test_fixtures/test_feature_surface_plan.py
          python test_fixtures/test_feature_surface_graph.py
          python test_fixtures/test_feature_surface_validation.py
          python test_fixtures/test_domain_plugin_registry.py
          python test_fixtures/test_domain_plugin_migration_actions.py
          python test_fixtures/test_battlefield_dsp_membership.py
          python test_fixtures/test_binding_index_provenance.py
          python test_fixtures/test_binding_audit_method_calls.py
          python test_fixtures/test_logical_migration_planner.py
          python test_fixtures/test_migration_backend_registry.py
          python test_fixtures/test_migration_backend_probe.py
          python test_fixtures/test_migration_backend_probe_plan.py
          python test_fixtures/test_dependency_package_plan.py
          python test_fixtures/test_package_manifest.py
          python test_fixtures/test_package_materialize.py
          python test_fixtures/test_validation_apply_journal.py
          python test_fixtures/test_backport_package_plan_scope.py
          python test_fixtures/test_semantic_instance_matching.py
          python test_fixtures/test_entity_symbol_identity.py
          python test_fixtures/test_roadmap_phase8.py
          python test_fixtures/test_instance_feature_slice.py
          python test_fixtures/test_instance_slice_compare.py
          python test_fixtures/test_feature_trace_enum_nodes.py
          python test_fixtures/test_feature_candidates.py
          python test_fixtures/test_feature_dimension_policy.py
          python test_fixtures/test_capability_observations.py
          python test_fixtures/test_semantic_graph_mirror.py
          python test_fixtures/test_capture_packet_graph.py
          python test_fixtures/test_capture_event_packet_graph.py

name: Workbench Regression

on:
  pull_request:
    paths:
      - "workbench/**"
      - "src/workbench/**"
      - "test_fixtures/**"
      - "gui/templates/**"
      - "docs/workbench/UI_LEGACY_TEMPLATE_ALLOWLIST.txt"
      - "tests/legacy/**"
      - "feature_*.py"
      - "capture_*.py"
      - "packet_*.py"
      - "workbench_*.py"
      - ".github/workflows/workbench-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core regression test dependencies
        run: python -m pip install --disable-pip-version-check jinja2 pyyaml pillow mwparserfromhell
      - name: Run Workbench core regression fixtures
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python tests/legacy/test_backport_lua_convert.py
          python tests/legacy/test_backport_sql_convert.py
          python tests/legacy/test_capture_ingestion.py
          python test_fixtures/test_packet_identity.py

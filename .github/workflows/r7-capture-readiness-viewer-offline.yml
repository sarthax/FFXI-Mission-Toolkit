name: R7 Optional Capture Readiness Viewer (Offline)

on:
  pull_request:
    paths:
      - "src/workbench/captures/scenario_readiness_viewer.py"
      - "gui/static/scenario_readiness_viewer.js"
      - "gui/static/scenario_developer.js"
      - "gui/templates/scenario_developer.html"
      - "src/workbench/server_admin/scenario_authoring/editor_router.py"
      - "test_fixtures/test_scenario_readiness_editor_attachment.py"
      - "test_fixtures/test_scenario_readiness_editor_attachment.cjs"
      - "test_fixtures/test_capture_readiness_viewer.py"
      - "test_fixtures/test_capture_readiness_viewer.cjs"
      - "docs/workbench/R7_OPTIONAL_CAPTURE_READINESS_VIEWER_1313.md"
      - ".github/workflows/r7-capture-readiness-viewer-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-readiness-viewer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-readonly-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing project and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest fastapi starlette jinja2 httpx
      - name: Paired-capture integrity and existing readiness nonpromotion tests
        env:
          PYTHONPATH: "src:test_fixtures:."
        run: |
          set -euo pipefail
          python -m pytest -q test_fixtures/test_capture_readiness_viewer.py test_fixtures/test_capture_readiness_summary.py test_fixtures/test_scenario_readiness_editor_attachment.py
      - name: Check attached editor syntax
        run: |
          node --check gui/static/scenario_developer.js
          node --check test_fixtures/test_scenario_readiness_editor_attachment.cjs
          node test_fixtures/test_scenario_readiness_editor_attachment.cjs
      - name: Independently run DOM and model safety suite
        run: |
          set -euo pipefail
          node --check gui/static/scenario_readiness_viewer.js
          node --check test_fixtures/test_capture_readiness_viewer.cjs
          node test_fixtures/test_capture_readiness_viewer.cjs

name: 2019 Wardrobe Static Audit (Offline)

on:
  push:
    branches:
      - research/2019-wardrobe-backport-gates-20261021
    paths:
      - src/workbench/client/wardrobe_2019_audit.py
      - src/workbench/client/wardrobe_2019_sidecar_model.py
      - src/workbench/client/cli/wardrobe_2019_report.py
      - test_fixtures/test_client_wardrobe_2019_*.py
      - .github/workflows/client-2019-wardrobe-offline.yml
  pull_request:
    paths:
      - src/workbench/client/wardrobe_2019_audit.py
      - src/workbench/client/wardrobe_2019_sidecar_model.py
      - src/workbench/client/cli/wardrobe_2019_report.py
      - test_fixtures/test_client_wardrobe_2019_*.py
      - .github/workflows/client-2019-wardrobe-offline.yml
  workflow_dispatch:

jobs:
  synthetic-wardrobe-2019:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic-only fingerprint, command and packet gate tests
        shell: bash
        run: |
          PYTHONPATH=src python -m unittest discover -s test_fixtures -p test_client_wardrobe_2019_*.py -v

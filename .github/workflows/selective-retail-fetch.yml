name: Selective Retail Fetch Rust

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/retail_fetch/**'
      - '.github/workflows/selective-retail-fetch.yml'
  push:
    branches:
      - 'feature/selective-pol-retail-fetch-20261018'
    paths:
      - 'tools/retail_fetch/**'
      - '.github/workflows/selective-retail-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-fetch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/retail_fetch -> target
      - name: Check
        run: cargo check --locked --manifest-path tools/retail_fetch/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path tools/retail_fetch/Cargo.toml

name: Canonical Scenario Contract v2 (Offline)

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/test_specifications.py"
      - "src/workbench/server_admin/feature_testing/scenario_contract_v2.py"
      - "src/workbench/server_admin/feature_testing/scenario_contract_v2_adapters.py"
      - "test_fixtures/test_scenario_contract_v2.py"
      - "test_fixtures/test_scenario_contract_v2_compatibility.py"
      - "test_fixtures/test_scenario_contract_v2_adapters.py"
      - "test_fixtures/test_scenario_contract_v2_source_associations.py"
      - "test_fixtures/scenario_contract_v2_staging_adapter_synthetic.json"
      - "test_fixtures/scenario_contract_v2_gardening_migration_synthetic.json"
      - "test_fixtures/scenario_contract_v2_synthetic.json"
      - ".github/workflows/scenario-contract-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline Workbench dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Run v2 contract, legacy specifications, editor draft and viewer regressions
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q test_fixtures/test_scenario_contract_v2.py test_fixtures/test_scenario_contract_v2_compatibility.py test_fixtures/test_scenario_contract_v2_adapters.py test_fixtures/test_scenario_contract_v2_source_associations.py test_fixtures/test_feature_testing_specifications.py test_fixtures/test_feature_testing_spec_drafts.py test_fixtures/test_feature_testing_scenario_presentation.py test_fixtures/test_scenario_guided_editor.py test_fixtures/test_feature_testing_normalized_evidence.py test_fixtures/test_feature_testing_importer.py

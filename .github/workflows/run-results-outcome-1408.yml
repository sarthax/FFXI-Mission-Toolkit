name: Run Results outcome states (Offline)

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/run_outcome.py"
      - "src/workbench/server_admin/feature_testing/execution_jobs.py"
      - "src/workbench/server_admin/feature_testing/router.py"
      - "gui/templates/feature_testing_run.html"
      - "gui/templates/feature_testing_outcome.html"
      - "gui/templates/feature_testing_steps.html"
      - "test_fixtures/test_run_outcome_1408.py"
      - "test_fixtures/results_v2_recorded/**"
      - "data/testing/feature_test_readiness.json"
      - "src/workbench/server_admin/feature_testing/importer.py"
      - "src/workbench/server_admin/feature_testing/scenario_presentation.py"
      - "test_fixtures/test_feature_testing_run_history.py"
      - "test_fixtures/test_feature_testing_run_reevaluation.py"
      - ".github/workflows/run-results-outcome-1408.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-results-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline Workbench dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Run Results outcome description, job lookup and rendered page (synthetic records only)
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q test_fixtures/test_run_outcome_1408.py test_fixtures/test_feature_testing_run_history.py test_fixtures/test_feature_testing_run_reevaluation.py test_fixtures/test_feature_testing_scenario_presentation.py test_fixtures/test_feature_testing_dashboard.py

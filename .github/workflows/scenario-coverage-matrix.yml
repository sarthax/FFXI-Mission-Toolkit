name: Scenario Coverage Matrix (Offline)

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/scenario_coverage/**"
      - "gui/templates/feature_testing_coverage.html"
      - "test_fixtures/test_scenario_coverage_matrix.py"
      - "test_fixtures/test_scenario_coverage_authoring.py"
      - ".github/workflows/scenario-coverage-matrix.yml"
      - "src/workbench/app/_host_impl.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest jinja2
      - name: Deterministic coverage regression (synthetic only)
        env:
          PYTHONPATH: src
        run: python -m pytest -q test_fixtures/test_scenario_coverage_matrix.py test_fixtures/test_scenario_coverage_authoring.py

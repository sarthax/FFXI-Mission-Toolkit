permissions:
  contents: read

jobs:
  editable-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and focused reference dependency
        run: python -m pip install --disable-pip-version-check -e . mwparserfromhell pytest
      - name: Validate canonical src package outside repository cwd
        run: |
          python test_fixtures/test_src_layout_package.py

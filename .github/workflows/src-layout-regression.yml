name: Src Layout Regression

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/workbench/**"
      - "workbench/__init__.py"
      - "feature_trace.py"
      - "wiki_evidence.py"
      - "wiki_claim_compare.py"
      - "capture_backtrace.py"
      - "capture_graph_connect.py"
      - "build_capture_index.py"
      - "youtube_chat_ocr.py"
      - "packet_decode.py"
      - "packet_opcode_index.py"
      - "salvage_reconstruct.py"
      - "addon_tools.py"
      - "workbench_connect.py"
      - "workbench_connect_server.py"
      - "dialog_drift_overview.py"
      - "ffxiclopedia_adapter.py"
      - "test_fixtures/test_src_layout_package.py"
      - "test_fixtures/test_feature_trace_package_migration.py"
      - "test_fixtures/test_dependency_services_package_migration.py"
      - "test_fixtures/test_acquisition_services_package_migration.py"
      - "test_fixtures/test_server_catalog_identity_package_migration.py"
      - "test_fixtures/test_feature_surface_component_boundary.py"
      - "test_fixtures/test_scripted_behavior_visualizer_package_migration.py"
      - "test_fixtures/test_map_confidence_graph_package_migration.py"
      - "test_fixtures/test_wiki_lookup_package_migration.py"
      - "test_fixtures/test_wiki_evidence_package_migration.py"
      - "test_fixtures/test_wiki_evidence_graph_package_migration.py"
      - "test_fixtures/test_capture_services_package_migration.py"
      - "test_fixtures/test_capture_integrity_package_migration.py"
      - "test_fixtures/test_packet_identity_package_migration.py"
      - "test_fixtures/test_capture_timeline_correlation_package_migration.py"
      - "test_fixtures/test_raw_packet_ingest_package_migration.py"
      - "test_fixtures/test_capture_pcap_lobby_package_migration.py"
      - "test_fixtures/test_capture_related_evidence_package_migration.py"
      - "test_fixtures/test_capture_backtrace_package_migration.py"
      - "test_fixtures/test_capture_graph_connect_package_migration.py"
      - "test_fixtures/test_capture_build_index_package_migration.py"
      - "test_fixtures/test_youtube_ocr_package_migration.py"
      - "test_fixtures/test_packet_decode_package_migration.py"
      - "test_fixtures/test_packet_opcode_index_package_migration.py"
      - "test_fixtures/test_salvage_reconstruct_package_migration.py"
      - "test_fixtures/test_addon_tools_package_migration.py"
      - "test_fixtures/test_runtime_connectors_package_migration.py"
      - "test_fixtures/test_dialog_drift_overview_package_migration.py"
      - "test_fixtures/test_ffxiclopedia_adapter_package_migration.py"
      - ".github/workflows/src-layout-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editable-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and focused reference dependency
        run: python -m pip install --disable-pip-version-check -e . mwparserfromhell
      - name: Validate canonical src package outside repository cwd
        run: |
          python test_fixtures/test_src_layout_package.py
          python test_fixtures/test_feature_trace_package_migration.py
          python test_fixtures/test_dependency_services_package_migration.py
          python test_fixtures/test_acquisition_services_package_migration.py
          python test_fixtures/test_server_catalog_identity_package_migration.py
          python test_fixtures/test_feature_surface_component_boundary.py
          python test_fixtures/test_scripted_behavior_visualizer_package_migration.py
          python test_fixtures/test_map_confidence_graph_package_migration.py
          python test_fixtures/test_wiki_lookup_package_migration.py
          python test_fixtures/test_wiki_evidence_package_migration.py
          python test_fixtures/test_wiki_evidence_graph_package_migration.py
          python test_fixtures/test_capture_services_package_migration.py
          python test_fixtures/test_capture_integrity_package_migration.py
          python test_fixtures/test_packet_identity_package_migration.py
          python test_fixtures/test_capture_timeline_correlation_package_migration.py
          python test_fixtures/test_raw_packet_ingest_package_migration.py
          python test_fixtures/test_capture_pcap_lobby_package_migration.py
          python test_fixtures/test_capture_related_evidence_package_migration.py
          python test_fixtures/test_capture_backtrace_package_migration.py
          python test_fixtures/test_capture_graph_connect_package_migration.py
          python test_fixtures/test_capture_build_index_package_migration.py
          python test_fixtures/test_youtube_ocr_package_migration.py
          python test_fixtures/test_packet_decode_package_migration.py
          python test_fixtures/test_packet_opcode_index_package_migration.py
          python test_fixtures/test_salvage_reconstruct_package_migration.py
          python test_fixtures/test_addon_tools_package_migration.py
          python test_fixtures/test_runtime_connectors_package_migration.py
          python test_fixtures/test_dialog_drift_overview_package_migration.py
          python test_fixtures/test_ffxiclopedia_adapter_package_migration.py

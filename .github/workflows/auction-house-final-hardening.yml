name: Auction House Final Hardening

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/workbench/server_admin/auction_house/**"
      - "gui/templates/auction_house*"
      - "gui/static/auction_house*"
      - "tests/test_auction_house_final_hardening.py"
      - ".github/workflows/auction-house-final-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ah-final-hardening:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolkit and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest fastapi jinja2 pyyaml pillow mwparserfromhell
      - name: Validate Auction House augment picker syntax
        run: |
          node --check gui/static/auction_house_augment_picker.js
          node --check gui/static/auction_house_console.js
          node --check gui/static/workbench_item_picker.js
      - name: Run AH interruption, schedule, and augment regressions
        run: python -m pytest -q tests/test_auction_house_final_hardening.py tests/test_auction_house_augmented_catalog.py

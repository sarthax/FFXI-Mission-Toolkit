name: Workbench Excavation Duty Cross-Fork

on:
  push:
    branches:
      - workbench-rework/audit-foundation
    paths:
      - "workbench/adapters/servers/**"
      - "workbench/migrations/**"
      - "test_fixtures/test_excavation_duty_crossfork.py"
      - ".github/workflows/workbench-excavation-duty.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excavation-duty-lsb-to-dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Mission Toolkit
        uses: actions/checkout@v4
        with:
          path: toolkit

      - name: Checkout pinned LandSandBoat source
        uses: actions/checkout@v4
        with:
          repository: LandSandBoat/server
          ref: 3747feee0e38ab5c0283c4fe8deea7f0a9022351
          path: external/lsb
          sparse-checkout: |
            sql/instance_list.sql
            sql/instance_entities.sql
            scripts/assaults/Lebros_Cavern/excavation_duty.lua
            data/zones/lebros_cavern/npcs.yaml
          sparse-checkout-cone-mode: false

      - name: Checkout pinned Darkstar target
        uses: actions/checkout@v4
        with:
          repository: DarkstarProject/darkstar
          ref: ee1f489efbdee2d95a4f1a6c842790da9f54306e
          path: external/dsp
          sparse-checkout: |
            sql/instance_list.sql
            sql/instance_entities.sql
            scripts/zones/Lebros_Cavern/instances/excavation_duty.lua
            scripts/zones/Lebros_Cavern/IDs.lua
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare Excavation Duty across forks
        working-directory: toolkit
        env:
          PYTHONPATH: .
        run: python test_fixtures/test_excavation_duty_crossfork.py ../external/lsb ../external/dsp

name: R7 Validation Sandbox Supervisor Isolation (Offline)

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/test_execution_settings.py"
      - "src/workbench/server_admin/feature_testing/execution_preflight.py"
      - "src/workbench/server_admin/feature_testing/execution_jobs.py"
      - "src/workbench/server_admin/feature_testing/router.py"
      - "gui/templates/feature_testing.html"
      - "test_fixtures/test_sandbox_supervisor_isolation_1333.py"
      - "test_fixtures/test_test_execution_settings.py"
      - "test_fixtures/test_feature_testing_execution.py"
      - "test_fixtures/test_feature_testing_operator_jobs.py"
      - "docs/workbench/R7_SANDBOX_ISOLATION_AND_B20_SECURITY_1333.md"
      - ".github/workflows/r7-sandbox-supervisor-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-execution-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline fixture dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest fastapi starlette httpx pymysql jinja2
      - name: Isolated sandbox and existing supervisor execution regressions
        env:
          PYTHONPATH: "src:test_fixtures:."
        run: |
          python -m pytest -q \
            test_fixtures/test_sandbox_supervisor_isolation_1333.py \
            test_fixtures/test_test_execution_settings.py \
            test_fixtures/test_feature_testing_execution.py \
            test_fixtures/test_feature_testing_operator_jobs.py
      - name: Static no execution approval / protected runner paths
        run: |
          python -m compileall -q src/workbench/server_admin/feature_testing/test_execution_settings.py src/workbench/server_admin/feature_testing/execution_preflight.py src/workbench/server_admin/feature_testing/execution_jobs.py
          grep -q 'sandbox_isolation' src/workbench/server_admin/feature_testing/execution_preflight.py
          grep -q 'sandbox_operator_check' src/workbench/server_admin/feature_testing/execution_jobs.py
          grep -q 'sandbox_execution_check' src/workbench/server_admin/feature_testing/execution_preflight.py

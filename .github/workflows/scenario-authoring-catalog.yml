name: Scenario Authoring Catalog (Offline)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/workbench/server_admin/scenario_authoring/**"
      - "gui/static/scenario_developer.js"
      - "gui/static/scenario_guided_model.js"
      - "test_fixtures/test_scenario_authoring_catalog.py"
      - ".github/workflows/scenario-authoring-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-readonly-catalog:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test catalog candidate invariants (synthetic data only)
        env:
          PYTHONPATH: src
        run: python -m pytest -q test_fixtures/test_scenario_authoring_catalog.py

name: ready-watch
# Read-only coordinator check when an issue gets (or loses) the `ready` label. Writes one comment per issue.
on:
  issues:
    types: [labeled, unlabeled, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ready-watch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  watch:
    # labeled/unlabeled only matter for `ready`; edited/reopened are handled by the script (silent if never ready)
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests
        run: python3 .github/scripts/test_ready_watch.py
      - name: Ready watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/ready_watch.py "$ISSUE_NUMBER"

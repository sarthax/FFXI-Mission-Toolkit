name: Guided Scenario Developer (Synthetic)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/workbench/server_admin/scenario_authoring/editor_router.py"
      - "src/workbench/app/host.py"
      - "gui/templates/scenario_developer.html"
      - "gui/static/scenario_developer.js"
      - "gui/static/scenario_draft_guard.js"
      - "gui/static/scenario_guided_model.js"
      - "gui/static/scenario_contract_v2_view.js"
      - "gui/static/scenario_typed_steps.js"
      - "test_fixtures/test_native_steps_schema_1411.py"
      - "src/workbench/server_admin/feature_testing/scenario_contract_v2.py"
      - "src/workbench/server_admin/feature_testing/test_specifications.py"
      - "src/workbench/server_admin/feature_testing/typed_action_library.py"
      - "test_fixtures/test_scenario_typed_steps_1411.py"
      - "test_fixtures/test_scenario_typed_steps.cjs"
      - "test_fixtures/test_scenario_contract_authoring.py"
      - "test_fixtures/test_scenario_contract_v2_view.cjs"
      - "test_fixtures/test_scenario_guided_*"
      - "test_fixtures/test_scenario_advanced_state.cjs"
      - "test_fixtures/test_scenario_unsaved_guard.cjs"
      - "test_fixtures/test_scenario_shape_focus_1403.cjs"
      - "gui/static/scenario_validation_feedback.js"
      - "test_fixtures/test_scenario_context_handoff.py"
      - "src/workbench/server_admin/scenario_authoring/context_handoff.py"
      - ".github/workflows/scenario-guided-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-contract:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workbench dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Run canonical synthetic editor contract and draft storage checks
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q test_fixtures/test_scenario_guided_editor.py test_fixtures/test_scenario_guided_catalog_workspace.py test_fixtures/test_scenario_context_handoff.py test_fixtures/test_scenario_authoring_catalog.py test_fixtures/test_feature_testing_spec_drafts.py test_fixtures/test_feature_testing_specifications.py test_fixtures/test_scenario_contract_authoring.py test_fixtures/test_scenario_typed_steps_1411.py test_fixtures/test_typed_action_library_1409.py test_fixtures/test_native_steps_schema_1411.py
      - name: Run browser-independent Guided/Advanced model tests
        run: |
          node test_fixtures/test_scenario_guided_model.cjs
          node test_fixtures/test_scenario_advanced_state.cjs
          node test_fixtures/test_scenario_unsaved_guard.cjs
          node test_fixtures/test_scenario_contract_v2_view.cjs
          node test_fixtures/test_scenario_typed_steps.cjs
          node test_fixtures/test_scenario_shape_focus_1403.cjs
      - name: Check browser module syntax
        run: |
          node --check gui/static/scenario_developer.js
          node --check gui/static/scenario_draft_guard.js
          node --check gui/static/scenario_contract_v2_view.js
          node --check gui/static/scenario_typed_steps.js

name: Guided Scenario Developer (Synthetic)
on:
  pull_request:
    paths:
      - "src/workbench/server_admin/scenario_authoring/editor_router.py"
      - "src/workbench/app/host.py"
      - "gui/templates/scenario_developer.html"
      - "gui/static/scenario_developer.js"
      - "gui/static/scenario_guided_model.js"
      - "test_fixtures/test_scenario_guided_*"
      - ".github/workflows/scenario-guided-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workbench dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Run canonical synthetic editor contract and draft storage checks
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q test_fixtures/test_scenario_guided_editor.py test_fixtures/test_scenario_guided_catalog_workspace.py test_fixtures/test_scenario_authoring_catalog.py test_fixtures/test_feature_testing_spec_drafts.py test_fixtures/test_feature_testing_specifications.py
      - name: Run browser-independent Guided/Advanced model tests
        run: node test_fixtures/test_scenario_guided_model.cjs
      - name: Check browser module syntax
        run: node --check gui/static/scenario_developer.js

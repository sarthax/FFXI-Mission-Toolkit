name: Test Catalog (Offline)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/workbench/server_admin/feature_testing/test_catalog.py"
      - "src/workbench/server_admin/feature_testing/spec_drafts.py"
      - "src/workbench/server_admin/feature_testing/catalog_view.py"
      - "gui/templates/feature_testing.html"
      - "gui/templates/feature_testing_catalog_entry.html"
      - "test_fixtures/test_test_catalog_browse_1410.py"
      - "gui/static/catalog_entry_review.js"
      - "test_fixtures/test_catalog_entry_review.cjs"
      - "src/workbench/server_admin/feature_testing/router.py"
      - "test_fixtures/test_test_catalog_1410.py"
      - "docs/workbench/TEST_CATALOG_1410.md"
      - ".github/workflows/test-catalog-1410.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-catalog:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline Workbench dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Catalog immutability, review states, search and access (synthetic specifications only)
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q test_fixtures/test_test_catalog_1410.py test_fixtures/test_test_catalog_browse_1410.py test_fixtures/test_feature_testing_spec_drafts.py test_fixtures/test_feature_testing_dashboard.py
      - name: Review controls request builder
        run: node test_fixtures/test_catalog_entry_review.cjs

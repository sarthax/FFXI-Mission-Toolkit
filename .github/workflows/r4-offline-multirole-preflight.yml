name: R4 Offline Multi-Role Preflight

on:
  pull_request:
    paths:
      - "src/workbench/server_admin/feature_testing/offline_multirole_preflight_1205.py"
      - "test_fixtures/test_offline_multirole_preflight_1205.py"
      - "docs/workbench/R4_OFFLINE_MULTIROLE_PREFLIGHT_1205.md"
      - ".github/workflows/r4-offline-multirole-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-role-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical source layout and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Check syntax and synthetic read-only role preflight
        env:
          PYTHONPATH: "src:."
        run: |
          set -euo pipefail
          python -m py_compile src/workbench/server_admin/feature_testing/offline_multirole_preflight_1205.py test_fixtures/test_offline_multirole_preflight_1205.py
          python -m pytest -q test_fixtures/test_offline_multirole_preflight_1205.py

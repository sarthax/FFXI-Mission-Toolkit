[package]
name = "ffxi-retail-selective"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ffxi-install = { git = "https://github.com/jondwillis/kuluu-ffxi", rev = "a7752b3a6a9c570b5af0011e89af6268615e8c14" }
tempfile = "3"
sha2 = "0.10"

# Dependency workspace patches are not inherited by this standalone package.
# ffxi-install requires Kuluu's public folder/offset APIs in its cab fork.
[patch.crates-io]
cab = { git = "https://github.com/jondwillis/kuluu-ffxi", rev = "a7752b3a6a9c570b5af0011e89af6268615e8c14" }
